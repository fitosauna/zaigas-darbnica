# Priekšskatījums GitHub Pages: https://fitosauna.github.io/zaigas-darbnica/
# Tikai apskatei (noindex, forma te nesūta). Īsto lapu publicē deploy.yml uz SiteGround.
name: Preview (GitHub Pages)

on:
  push:
    branches: [claude/loving-dijkstra-09k137, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
      - name: Pielāgot apakšceļam un aizliegt indeksēšanu
        run: python3 scripts/pages-preview.py dist /zaigas-darbnica
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
